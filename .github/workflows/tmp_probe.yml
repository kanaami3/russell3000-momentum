name: tmp probe
on:
  push:
    branches: [claude/flows-fix]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python batch/fetch_margin_balance.py
      - run: python batch/fetch_investor_flows.py
      - run: python batch/build_ignition_signals.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add web/data/margin_balance_history.json web/data/investor_flows_jp.json web/data/ignition_signals.json
          git commit -m "tmp: refreshed data" || true
          git push origin HEAD:claude/flows-fix
