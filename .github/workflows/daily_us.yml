name: Daily US (Russell 3000) Momentum Update

on:
  schedule:
    # 実行分を workflow ごとにズラして同一 concurrency グループ(data-update)の
    # 保留キャンセル衝突を回避。US は :02(09:02 JST / US引け直後)。
    - cron: "2 0 * * *"   # 09:02 JST(US引け直後・JP寄付直前)
    # 多重保険: GitHub Actions の cron ドロップ対策で 3 時間帯に分散
    # (鮮度ガードで当日分が既に生成済みなら高コストな AI ステップはスキップ)
    - cron: "2 3 * * *"   # 12:02 JST
    - cron: "2 6 * * *"   # 15:02 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 多重 cron で同日に複数回起動するので、当日分が既に揃っていれば
      # 全ステップをスキップして無駄なデータ取得を抑える。
      # 判定は indices.json が < 6h で生成済みかどうか。
      - name: Check if today's US data already fresh
        id: freshness
        run: |
          NEED=$(python3 -c "
          import json
          from datetime import datetime
          try:
              ix = json.load(open('web/data/indices.json'))
              gen = datetime.fromisoformat(ix['generated_at_jst'])
              age_h = (datetime.now(gen.tzinfo) - gen).total_seconds() / 3600
              print('false' if age_h < 6 else 'true')
          except Exception:
              print('true')
          ")
          echo "need_run=$NEED" >> "$GITHUB_OUTPUT"
          echo "US run needed: $NEED"

      - name: Fetch US universe (top 3000 by market cap)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_universe.py

      - name: Fetch US prices (yfinance, ~14 months daily)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_prices.py us

      - name: Compute US momentum metrics
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/calc_momentum.py us

      - name: Fetch indices (N225 / NDX / USDJPY with indicators)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_indices.py

      - name: Fetch Nikkei 225 EPS (official PER → derive EPS)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_nikkei_eps.py

      - name: Fetch TOPIX EPS (JPX monthly PER × TOPIX close, multi-year)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_topix_eps.py

      - name: Generate AI swing picks (US, Claude)
        if: steps.freshness.outputs.need_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python batch/generate_swing_picks.py us
          else
            echo "ANTHROPIC_API_KEY not set — skipping swing picks"
          fi

      - name: Commit and push
        if: steps.freshness.outputs.need_run == 'true'
        run: |
          bash batch/safe_commit_push.sh \
            "data(us): daily update $(date -u +%Y-%m-%d)" \
            data/universe_us.json web/data/momentum_us.json web/data/chart_data_us.json \
            web/data/indices.json web/data/swing_picks_us.json \
            web/data/nikkei_eps_history.json web/data/topix_eps_history.json
      # 指数の Discord 通知は 21:00 JST の統合ダイジェスト(weekly_value_jp)に集約。
      # ここでは送信しない。
