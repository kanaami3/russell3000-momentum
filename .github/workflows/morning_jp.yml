name: Morning JP Daytrade Brief

on:
  schedule:
    # 統一実行時刻: 平日 09:00 JST(当日寄付向けピックを生成)= 00:00 UTC
    - cron: "0 0 * * *"
    # 多重保険: GitHub Actions の cron ドロップ対策で 3 時間帯に分散
    # (鮮度ガードで当日分が既に生成済みなら全ステップをスキップ)
    - cron: "0 3 * * *"  # 12:00 JST
    - cron: "0 6 * * *"  # 15:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # コミット済みのブリーフが新鮮なら全ステップをスキップ。多重 cron 起動
      # で同日に何度も呼ばれても二重課金が出ない。
      - name: Check committed brief freshness (before build overwrites)
        id: freshness
        run: |
          NEED=$(python3 -c "
          import json
          from datetime import datetime
          try:
              b = json.load(open('web/data/morning_brief_jp.json'))
              has_picks = bool(b.get('ai_picks'))
              gen = datetime.fromisoformat(b['generated_at_jst'])
              age_h = (datetime.now(gen.tzinfo) - gen).total_seconds() / 3600
              print('false' if has_picks and age_h < 6 else 'true')
          except Exception:
              print('true')
          ")
          echo "need_run=$NEED" >> "$GITHUB_OUTPUT"
          echo "Morning brief run needed: $NEED"

      - name: Fetch JP universe (Prime market)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_universe_jp.py

      - name: Fetch JP prices (yfinance OHLCV)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/fetch_prices.py jp

      - name: Build morning brief (picks + overnight signals)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/build_morning_brief.py

      - name: Generate AI morning brief (Claude)
        if: steps.freshness.outputs.need_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python batch/generate_morning_brief_ai.py
          else
            echo "ANTHROPIC_API_KEY not set — skipping AI brief"
          fi

      - name: Compute JP momentum + chart data (for divergence detection)
        if: steps.freshness.outputs.need_run == 'true'
        run: python batch/calc_momentum.py jp

      - name: Commit and push
        if: steps.freshness.outputs.need_run == 'true'
        run: |
          bash batch/safe_commit_push.sh \
            "data(jp morning): daytrade brief $(date -u +%Y-%m-%d)" \
            data/universe_jp.json web/data/morning_brief_jp.json \
            web/data/momentum_jp.json web/data/chart_data_jp.json
