name: tmp fg preview (削除予定)
on:
  push:
    branches: [feature/fear-greed-sp500]
    paths: [.github/workflows/tmp_fg_preview.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - run: |
          cd batch && python -c "
          import json, build_ignition_signals as b
          rows = b.build_fear_greed([])
          json.dump(rows, open('/tmp/fg.json','w'))
          print('ROWS', len(rows)); print('FGJSON' + json.dumps(rows, separators=(',',':')))
          "
