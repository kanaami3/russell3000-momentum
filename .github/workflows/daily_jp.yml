name: Daily JP (TSE Prime) Momentum Update

on:
  schedule:
    # 統一実行時刻: 平日 09:00 JST(前日JP引けデータを処理)= 00:00 UTC
    # concurrency 衝突回避のため :14 にズラす(US=:02 の後)
    - cron: "14 0 * * *"  # 09:14 JST
    # 多重保険: GitHub Actions の cron ドロップ対策で 3 時間帯に分散
    # (鮮度ガードで当日分が既に処理済みなら AI ステップはスキップ)
    - cron: "14 3 * * *"  # 12:14 JST
    - cron: "14 6 * * *"  # 15:14 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch JP universe (TSE Prime constituents from JPX)
        run: python batch/fetch_universe_jp.py

      - name: Fetch JP prices (yfinance, ~14 months daily)
        run: python batch/fetch_prices.py jp

      - name: Compute JP momentum metrics
        run: python batch/calc_momentum.py jp

      # Skip the (paid) Claude steps if swing picks were already generated
      # < 6h ago (a redundant same-day cron run). Otherwise generate them.
      - name: Check if AI already generated for today
        id: freshness
        run: |
          NEED=$(python3 -c "
          import json
          from datetime import datetime
          try:
              s = json.load(open('web/data/swing_picks_jp.json'))
              gen = datetime.fromisoformat(s['generated_at_jst'])
              age_h = (datetime.now(gen.tzinfo) - gen).total_seconds() / 3600
              print('false' if age_h < 6 else 'true')
          except Exception:
              print('true')
          ")
          echo "need_ai=$NEED" >> "$GITHUB_OUTPUT"
          echo "AI generation needed: $NEED"

      - name: Generate AI swing picks (JP, Claude)
        if: steps.freshness.outputs.need_ai == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python batch/generate_swing_picks.py jp
          else
            echo "ANTHROPIC_API_KEY not set — skipping swing picks"
          fi

      - name: Commit and push
        run: |
          bash batch/safe_commit_push.sh \
            "data(jp): daily update $(date -u +%Y-%m-%d)" \
            data/universe_jp.json web/data/momentum_jp.json web/data/chart_data_jp.json \
            web/data/swing_picks_jp.json
