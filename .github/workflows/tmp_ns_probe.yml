name: tmp ns probe
on:
  push:
    branches: [claude/ns-ratio]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python batch/build_ignition_signals.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add web/data/ignition_signals.json
          git commit -m "tmp: ns data" || true
          git push origin HEAD:claude/ns-ratio
