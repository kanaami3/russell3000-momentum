<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- momentum bars: 右上がりに並べ、奥ほど薄くして奥行きを出す -->
  <rect x="13" y="36" width="8" height="15" rx="2" fill="#ffffff" opacity="0.45"/>
  <rect x="25" y="29" width="8" height="22" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="37" y="21" width="8" height="30" rx="2" fill="#ffffff" opacity="0.75"/>
  <rect x="49" y="13" width="8" height="38" rx="2" fill="#ffffff" opacity="0.95"/>
  <!-- 上昇ライン: 16px に縮めるとバーは潰れるが、この線だけは形が残る -->
  <polyline points="13,40 29,33 41,25 53,15" fill="none" stroke="#fbbf24"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
