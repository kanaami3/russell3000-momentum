<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>燃料と着火スイッチ</title>
<meta name="theme-color" content="#FFFFFF">
<style>
  :root{
    --bg:#F8FAFC; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#E2E8F0; --line-soft:#F1F5F9;
    --text:#0F172A; --muted:#475569; --muted-2:#94A3B8;
    --fuel:#EA580C; --fuel-bg:#FFF7ED;
    --fire:#E11D48; --fire-bg:#FFF1F2;
    --off:#CBD5E1; --accent:#2563EB; --ok:#059669; --ref:#D97706;
    --mono:"SFMono-Regular","JetBrains Mono","Roboto Mono",ui-monospace,monospace;
    --sans:"Inter",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 16px 48px}
  .top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
  .top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .top .tl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase;margin-top:3px}
  .spacer{flex:1}
  .chip{font-family:var(--mono);font-size:10.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}

  /* summary */
  .sum{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:26px}
  @media(max-width:760px){.sum{grid-template-columns:1fr}}
  .sbox{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .sbox .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .big{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1.1;margin:6px 0 10px}
  .big small{font-size:18px;color:var(--muted-2);font-weight:600}
  .lamps{display:flex;gap:8px;flex-wrap:wrap}
  .lamp{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--panel-2);border:2px solid var(--off);color:var(--muted-2);cursor:pointer;text-decoration:none}
  .lamp.unk{border-style:dashed}
  .lamp.fuel.on{background:var(--fuel);border-color:var(--fuel);color:#fff;box-shadow:0 0 0 3px rgba(234,88,12,.18)}
  .lamp.fire.on{background:var(--fire);border-color:var(--fire);color:#fff;box-shadow:0 0 0 3px rgba(225,29,72,.18)}
  .meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,#F59E0B,var(--fire));border-radius:6px;transition:width .4s}
  .verdict{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

  h2.sec{font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .secdesc{font-size:12px;color:var(--muted);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
  .card.fuel.on{border-color:#FDBA74;background:linear-gradient(180deg,var(--fuel-bg) 0%,var(--panel-2) 100%)}
  .card.fire.on{border-color:#FDA4AF;background:linear-gradient(180deg,var(--fire-bg) 0%,var(--panel-2) 100%)}
  .head{display:flex;gap:10px;align-items:flex-start}
  .head .lamp{flex-shrink:0;cursor:default}
  .head .nm{font-size:13.5px;font-weight:650;line-height:1.4}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-weight:600}
  .tag.st-on.fuel{color:var(--fuel);border-color:#FDBA74;background:#FFF7ED}
  .tag.st-on.fire{color:var(--fire);border-color:#FDA4AF;background:#FFF1F2}
  .tag.st-off{color:var(--muted)}
  .tag.st-unk{color:#B45309;border-color:#FCD34D;background:#FFFBEB}
  .val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .val b{font-family:var(--mono);font-size:22px;font-weight:700}
  .val .u{font-size:12px;color:var(--muted)}
  .val .th{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-left:auto}
  .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .detail{font-size:11.5px;color:var(--muted);line-height:1.55}
  .manual{font-size:11.5px;line-height:1.5;padding:7px 9px;border-radius:8px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
  .meta{font-family:var(--mono);font-size:10px;color:var(--muted-2);display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
  svg.spark{display:block;width:100%;height:auto}
  .nohist{font-size:11px;color:var(--muted-2);font-family:var(--mono);padding:6px 0}
  .spark .ln{fill:none;stroke-width:1.6}
  .spark .th{stroke:var(--muted-2);stroke-dasharray:3 3;stroke-width:1}
  .spark text{paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;font-family:var(--mono);font-size:11px;fill:var(--muted-2)}
  .legend{font-family:var(--mono);font-size:10px;color:var(--muted-2);display:flex;gap:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
  .note{font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
  .note code{font-family:var(--mono);font-size:11px;background:var(--panel);padding:1px 5px;border-radius:4px;color:var(--text)}
  /* 日経平均とEPS×PER */
  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-bottom:28px;position:relative;scroll-margin-top:12px}
  .vhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .vhead h3{font-size:14px;font-weight:700;margin:0}
  .vhead .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rng{display:flex;gap:4px;margin-left:auto}
  .rng button{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
  .rng button.on{background:var(--text);color:#fff;border-color:var(--text)}
  .vstats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:6px 0 4px}
  .vstats b{color:var(--text);font-size:13px}
  #vchart svg,#nschart svg{display:block;width:100%}
  #vchart text,#nschart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
  #vchart .gl,#nschart .gl{stroke:var(--line-soft);stroke-width:1}
  #vchart .fr,#nschart .fr{fill:none;stroke:var(--line);stroke-width:1}
  #vchart .pt-l,#nschart .pt-l{font-size:10.5px;fill:var(--text);font-weight:600}
  .vtip{position:absolute;pointer-events:none;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.6;box-shadow:0 6px 18px rgba(15,23,42,.12);white-space:nowrap;z-index:5}
  .vtip .sw{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}
  .vleg{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
  .vleg i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
  .vleg i.dash{border-top-style:dashed}
  .vexp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line, #E5E7EB);font-size:13px;line-height:1.75}
  .vexp h4{margin:0 0 6px;font-size:14px}
  .vexp ol{margin:8px 0;padding-left:4px;list-style:none}
  .vexp li{margin-bottom:8px}
  .vexp li b{display:block}
  .vexp .now{background:#F5F3FF;border-radius:8px;padding:8px 12px;margin:8px 0}
  .vexp .pt{color:var(--muted)}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:60px 0;font-family:var(--mono)}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>燃料と着火スイッチ</h1>
      <div class="tl">Short-covering fuel &amp; end-of-rally switches</div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="gen">読み込み中…</span>
  </div>
  <div id="app"><div class="empty">データを読み込み中…</div></div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

function fmtNum(v) {
  if (v == null) return '—';
  const n = v.num;
  if (n == null) return '—';
  const abs = Math.abs(n);
  const s = abs >= 1000 ? Math.round(n).toLocaleString() : (Number.isInteger(n) ? String(n) : n.toFixed(2));
  return (v.signed && n > 0 ? '+' : '') + s;
}
function md(d) { if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${y}/${+m}/${+dd}`; }
function stateOf(it) { return it.lit === true ? 'on' : it.lit === false ? 'off' : 'unk'; }
function stateLabel(it) { return it.lit === true ? '点灯' : it.lit === false ? '消灯' : '未判定'; }
function methodLabel(it) {
  if (it.method === 'manual') return it.auto_lit !== undefined ? '手動で上書き' : '手動判定';
  return '自動';
}

// ---- small SVG charts ----------------------------------------------------
const W = 520, H = 120, PL = 2, PR = 48, PT = 8, PB = 14;
function scaler(vals, extra = []) {
  const all = vals.concat(extra).filter(v => v != null && isFinite(v));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  return v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo));
}
function path(xs, ys) {
  let d = '', pen = false;
  xs.forEach((x, i) => {
    if (ys[i] == null) { pen = false; return; }
    d += (pen ? 'L' : 'M') + x.toFixed(1) + ',' + ys[i].toFixed(1); pen = true;
  });
  return d;
}
function shortNum(v) { const a = Math.abs(v); return a >= 10000 ? (v / 10000).toFixed(1) + '万' : a >= 100 ? Math.round(v).toLocaleString() : (+v.toFixed(2)).toString(); }
function axisLabels(series) {
  if (!series.length) return '';
  return `<text x="${PL}" y="${H - 2}">${md(series[0][0])}</text><text x="${W - PR}" y="${H - 2}" text-anchor="end">${md(series[series.length - 1][0])}</text>`;
}
function chartSVG(ch, color) {
  if (!ch || !ch.series) return '';
  if (ch.series.length < 2) return '<div class="nohist">推移グラフは週ごとの更新で履歴が貯まると表示されます。</div>';
  const s = ch.series, n = s.length;
  const xs = s.map((_, i) => PL + (W - PL - PR) * (n === 1 ? 0 : i / (n - 1)));
  let body = '', legend = '';
  if (ch.type === 'line' || ch.type === 'bar') {
    const vals = s.map(r => r[1]);
    const y = scaler(vals, ch.line != null ? [ch.line] : []);
    if (ch.line != null) body += `<line class="th" x1="${PL}" x2="${W - PR}" y1="${y(ch.line)}" y2="${y(ch.line)}"/><text x="${PL + 2}" y="${y(ch.line) - 4}">基準 ${shortNum(ch.line)}</text>`;
    if (ch.type === 'bar') {
      const bw = Math.max(2, (W - PL - PR) / n * 0.65), z = y(0);
      s.forEach((r, i) => {
        const yy = y(r[1]);
        body += `<rect x="${xs[i] - bw / 2}" y="${Math.min(yy, z)}" width="${bw}" height="${Math.max(1, Math.abs(z - yy))}" fill="${r[1] < 0 ? 'var(--fire)' : 'var(--ok)'}" opacity=".8"/>`;
      });
    } else {
      body += `<path class="ln" d="${path(xs, vals.map(y))}" stroke="${color}"/>`;
    }
    const last = vals[n - 1];
    body += `<text x="${W - PR + 4}" y="${y(last) + 3}" style="fill:${color}">${shortNum(last)}</text>`;
  } else if (ch.type === 'macd') {
    const m = s.map(r => r[1]), g = s.map(r => r[2]);
    const y = scaler(m.concat(g), [0]);
    body += `<line class="th" x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}"/>`;
    body += `<path class="ln" d="${path(xs, g.map(y))}" stroke="var(--ref)"/>`;
    body += `<path class="ln" d="${path(xs, m.map(y))}" stroke="${color}"/>`;
    legend = `<div class="legend"><span><i style="background:${color}"></i>MACD</span><span><i style="background:var(--ref)"></i>シグナル</span></div>`;
  } else if (ch.type === 'bb') {
    const c = s.map(r => r[1]), u2 = s.map(r => r[2]), u1 = s.map(r => r[3]), m = s.map(r => r[4]);
    const y = scaler(c.concat(u2, m));
    body += `<path class="ln" d="${path(xs, u2.map(y))}" stroke="var(--ref)" stroke-dasharray="4 3"/>`;
    body += `<path class="ln" d="${path(xs, u1.map(y))}" stroke="#60A5FA" stroke-dasharray="2 3"/>`;
    body += `<path class="ln" d="${path(xs, m.map(y))}" stroke="var(--muted-2)" stroke-width="1"/>`;
    body += `<path class="ln" d="${path(xs, c.map(y))}" stroke="${color}"/>`;
    s.forEach((r, i) => { if (r[1] >= r[2]) body += `<circle cx="${xs[i]}" cy="${y(r[1])}" r="2.4" fill="var(--ref)"/>`; });
    legend = `<div class="legend"><span><i style="background:${color}"></i>日経225</span><span><i style="background:var(--ref)"></i>+2σ(点=+2σ以上)</span><span><i style="background:#60A5FA"></i>+1σ</span><span><i style="background:var(--muted-2)"></i>20日線</span></div>`;
  } else if (ch.type === 'nikkei') {
    const ref = ch.show === 'pbr' ? 3 : 2;
    const c = s.map(r => r[1]), r2 = s.map(r => r[ref]);
    const y = scaler(c.concat(r2));
    body += `<path class="ln" d="${path(xs, r2.map(v => v == null ? null : y(v)))}" stroke="var(--ref)" stroke-dasharray="4 3"/>`;
    body += `<path class="ln" d="${path(xs, c.map(y))}" stroke="${color}"/>`;
    const lastRef = r2.filter(v => v != null).pop();
    if (lastRef != null) body += `<text x="${W - PR + 4}" y="${y(lastRef) + 3}" style="fill:var(--ref)">${shortNum(lastRef)}</text>`;
    legend = `<div class="legend"><span><i style="background:${color}"></i>日経平均</span><span><i style="background:var(--ref)"></i>${ch.show === 'pbr' ? 'PBR2倍ライン' : '理論値'}</span></div>`;
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img">${body}${axisLabels(s)}</svg>${legend}`;
}

// ---- cards ---------------------------------------------------------------
function card(it, kind) {
  const st = stateOf(it);
  const color = kind === 'fuel' ? 'var(--fuel)' : 'var(--fire)';
  const v = it.value;
  const manual = it.method === 'manual'
    ? `<div class="manual">${it.lit == null ? 'まだ判定が入力されていません。' : ''}${esc(it.manual_note || '')}${it.manual_updated ? `(${esc(it.manual_updated)} 更新)` : ''}</div>` : '';
  return `<div class="card ${kind} ${st}" id="${kind}-${it.no}">
    <div class="head">
      <span class="lamp ${kind} ${st}">${it.no}</span>
      <div>
        <div class="nm">${esc(it.name)}</div>
        <div class="tags"><span class="tag st-${st} ${kind}">${stateLabel(it)}</span><span class="tag">${methodLabel(it)}</span></div>
      </div>
    </div>
    ${v ? `<div class="val"><b>${fmtNum(v)}</b><span class="u">${esc(v.unit)}</span><span class="th">条件 ${esc(it.threshold)}</span></div>` : `<div class="val"><span class="th" style="margin-left:0">条件 ${esc(it.threshold)}</span></div>`}
    ${v && v.sub ? `<div class="sub">${esc(v.sub)}</div>` : ''}
    ${manual}
    ${chartSVG(it.chart, color)}
    ${it.detail ? `<div class="detail">${esc(it.detail)}</div>` : ''}
    ${it.key === 'japan_edge' ? `<a class="detail" href="#nsratio" style="color:var(--accent)">NS倍率と日経・S&P500のグラフを見る ↓</a>` : ''}
    ${it.key === 'below_theory' ? `<a class="detail" href="#valuation" style="color:var(--accent)">16・17・18倍のグラフを見る ↓</a>` : ''}
    <div class="meta"><span>基準日 ${md(it.asof)}</span><span>${esc(it.source)}</span></div>
  </div>`;
}

function lampsRow(items, kind) {
  return `<div class="lamps">${items.map(it => `<a class="lamp ${kind} ${stateOf(it)}" href="#${kind}-${it.no}" title="${esc(it.name)}:${stateLabel(it)}">${it.no}</a>`).join('')}</div>`;
}

function verdictText(s) {
  const k = s.switch_lit, n = s.switch_total;
  if (k >= 6) return `着火スイッチが${n}個中${k}個点灯。売られる要因がかなり揃っています。下落に要注意です。`;
  if (k >= 4) return `着火スイッチが${n}個中${k}個点灯。売られる要因が半分以上揃い、下落を意識する段階です。`;
  if (k >= 2) return `着火スイッチは${n}個中${k}個点灯。売られる要因はまだ一部だけです。`;
  return `売られる要因はほとんど点いていません。`;
}

function render(d) {
  const s = d.summary;
  const g = new Date(d.generated_at_jst);
  $('#gen').textContent = `更新 ${g.getMonth() + 1}/${g.getDate()} ${String(g.getHours()).padStart(2, '0')}:${String(g.getMinutes()).padStart(2, '0')}`;
  $('#app').innerHTML = `
    <div class="sum">
      <div class="sbox">
        <div class="lbl"><span>🛢 燃料(買い戻しの土台)</span></div>
        <div class="big">${s.fuel_lit}<small> / ${s.fuel_total}</small></div>
        ${lampsRow(d.fuel, 'fuel')}
        <div class="verdict">${s.fuel_lit === s.fuel_total ? '燃料が揃っています。踏み上げが起きやすい土台です。' : s.fuel_lit ? '燃料は一部だけ。' : '燃料は空の状態です。'}</div>
      </div>
      <div class="sbox">
        <div class="lbl"><span>🔥 着火スイッチ(売られる要因。揃うほど下落に注意)</span>${s.switch_unknown ? `<span style="color:#B45309">未判定 ${s.switch_unknown}</span>` : ''}</div>
        <div class="big">${s.switch_lit}<small> / ${s.switch_total}</small></div>
        ${lampsRow(d.switches, 'fire')}
        <div class="meter"><i style="width:${(s.switch_lit / s.switch_total * 100).toFixed(0)}%"></i></div>
        <div class="verdict">${verdictText(s)}</div>
      </div>
    </div>

    <h2 class="sec">🛢 燃料</h2>
    <p class="secdesc">売り方が多く積み上がっているほど、買い戻しで相場が押し上げられる土台になります。</p>
    <div class="grid">${d.fuel.map(it => card(it, 'fuel')).join('')}</div>

    <div class="vcard" id="valuation">
      <div class="vhead">
        <div>
          <h3>📈 日経平均とEPS×PER(16・17・18倍)</h3>
          <div class="d">EPS = 終値 ÷ 加重平均PER(日経公表)。点線は「その倍率まで買われたら日経平均はいくらか」の目安です。</div>
        </div>
        <div class="rng" id="vrng">
          <button data-r="6m" class="on">6ヶ月</button><button data-r="1y">1年</button><button data-r="all">全期間</button>
        </div>
      </div>
      <div class="vstats" id="vstats"></div>
      <div id="vchart"></div>
      <div class="vleg">
        <span><i style="border-color:var(--text)"></i>日経平均</span>
        <span><i class="dash" style="border-color:#60A5FA"></i>EPS×PER16</span>
        <span><i class="dash" style="border-color:#F59E0B"></i>EPS×PER17</span>
        <span><i class="dash" style="border-color:#DC2626"></i>EPS×PER18</span>
        <span><i style="border-color:#1E40AF"></i>EPS</span>
        <span><i style="border-color:#7C3AED"></i>PER</span>
      </div>

// ---- 日経平均とEPS×PER(3段グラフ) -----------------------------------------
const VCOL = { close: 'var(--text)', p16: '#60A5FA', p17: '#F59E0B', p18: '#DC2626', eps: '#1E40AF', per: '#7C3AED' };
let VROWS = [], VRANGE = '6m';
function vSlice() {
  if (!VROWS.length || VRANGE === 'all') return VROWS;
  const last = new Date(VROWS[VROWS.length - 1][0]);
  const from = new Date(last); from.setMonth(from.getMonth() - (VRANGE === '6m' ? 6 : 12));
  const f = from.toISOString().slice(0, 10);
  return VROWS.filter(r => r[0] >= f);
}
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function drawValuation() {
  const box = $('#vchart'); if (!box) return;
  const rows = vSlice(); if (rows.length < 2) { box.innerHTML = '<div class="nohist">データがありません</div>'; return; }
  const W = Math.max(320, box.clientWidth), narrow = W < 560;
  const L = narrow ? 44 : 58, R = narrow ? 8 : 14;
  const panels = [
    { key: 'main', h: narrow ? 220 : 300, label: '日経平均(円)' },
    { key: 'eps', h: narrow ? 120 : 160, label: 'EPS(円)' },
    { key: 'per', h: narrow ? 100 : 130, label: 'PER(倍)' },
  ];
  const GAP = 16, XB = 22;
  let top = 6; panels.forEach(p => { p.y0 = top; top += p.h + GAP; });
  const H = top - GAP + XB;
  const n = rows.length, x = i => L + (W - L - R) * i / (n - 1);
  const D = rows.map(r => ({ d: r[0], c: r[1], e: r[2], p: r[3], p16: r[2] * 16, p17: r[2] * 17, p18: r[2] * 18 }));
  const fmt = v => Math.round(v).toLocaleString();
  let svg = '';
  const series = {
    main: [['p16', VCOL.p16, true], ['p17', VCOL.p17, true], ['p18', VCOL.p18, true], ['c', VCOL.close, false]],
    eps: [['e', VCOL.eps, false]], per: [['p', VCOL.per, false]],
  };
  const yOf = {};
  panels.forEach(p => {
    const keys = series[p.key].map(s => s[0]);
    let vals = D.flatMap(r => keys.map(k => r[k]));
    if (p.key === 'main') { const cs = D.map(r => r.c); const lo = Math.min(...cs), hi = Math.max(...cs); vals = vals.filter(v => v > lo * 0.9 && v < hi * 1.08).concat(cs); }
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const y = v => p.y0 + p.h * (1 - (v - lo) / (hi - lo)); yOf[p.key] = y;
    svg += `<defs><clipPath id="cp-${p.key}"><rect x="${L}" y="${p.y0}" width="${W - L - R}" height="${p.h}"/></clipPath></defs>`;
    niceTicks(lo, hi, narrow ? 3 : 5).forEach(t => {
      svg += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${p.key === 'per' ? t.toFixed(1) : t.toLocaleString()}</text>`;
    });
    svg += `<rect class="fr" x="${L}" y="${p.y0}" width="${W - L - R}" height="${p.h}"/>`;
    svg += `<g clip-path="url(#cp-${p.key})">`;
    series[p.key].forEach(([k, col, dash]) => {
      svg += `<path d="${path(D.map((_, i) => x(i)), D.map(r => y(r[k])))}" fill="none" stroke="${col}" stroke-width="${dash ? 1.4 : 1.9}" ${dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    });
    svg += `</g>`;
  });
  // 期間内の高値に印
  let im = 0; D.forEach((r, i) => { if (r.c > D[im].c) im = i; });
  const xm = x(im);
  svg += `<line x1="${xm}" x2="${xm}" y1="${panels[0].y0}" y2="${panels[2].y0 + panels[2].h}" stroke="#DC2626" stroke-opacity=".25"/>`;
  [['main', D[im].c, `${md(D[im].d)} ${fmt(D[im].c)}`], ['eps', D[im].e, fmt(D[im].e)], ['per', D[im].p, D[im].p.toFixed(2)]].forEach(([k, v, lab]) => {
    const yy = yOf[k](v), anchor = xm > W - 120 ? 'end' : xm < L + 80 ? 'start' : 'middle';
    svg += `<circle cx="${xm}" cy="${yy}" r="4" fill="#DC2626"/><text class="pt-l" x="${xm}" y="${yy - 9}" text-anchor="${anchor}">${lab}</text>`;
  });
  // x軸
  const nt = narrow ? 4 : 8;
  for (let k = 0; k <= nt; k++) {
    const i = Math.round((n - 1) * k / nt);
    svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === nt ? 'end' : 'middle'}">${md(D[i].d).slice(narrow ? 5 : 0)}</text>`;
  }
  svg += `<line id="vx" x1="0" x2="0" y1="${panels[0].y0}" y2="${panels[2].y0 + panels[2].h}" stroke="var(--muted-2)" stroke-dasharray="3 3" style="display:none"/>`;
  svg += `<rect id="vhit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${svg}</svg>`;

  const last = D[n - 1];
  $('#vstats').innerHTML = `<span>${md(last.d)} 終値 <b>${fmt(last.c)}</b></span><span>EPS <b>${fmt(last.e)}</b></span><span>PER <b>${last.p.toFixed(2)}</b>倍</span>`
    + `<span>×16 <b style="color:${VCOL.p16}">${fmt(last.p16)}</b></span><span>×17 <b style="color:${VCOL.p17}">${fmt(last.p17)}</b></span><span>×18 <b style="color:${VCOL.p18}">${fmt(last.p18)}</b></span>`;

  const hit = $('#vhit'), vx = $('#vx'), tip = $('#vtip'), card = $('#valuation');
  const move = ev => {
    const pt = ev.touches ? ev.touches[0] : ev;
    const rect = box.querySelector('svg').getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((pt.clientX - rect.left - L) / (W - L - R) * (n - 1))));
    const r = D[i], xi = x(i);
    vx.setAttribute('x1', xi); vx.setAttribute('x2', xi); vx.style.display = '';
    tip.innerHTML = `<b>${md(r.d)}</b><br><span class="sw" style="background:${VCOL.close}"></span>日経平均 ${fmt(r.c)}<br>`
      + `<span class="sw" style="background:${VCOL.p18}"></span>×18 ${fmt(r.p18)}<br><span class="sw" style="background:${VCOL.p17}"></span>×17 ${fmt(r.p17)}<br><span class="sw" style="background:${VCOL.p16}"></span>×16 ${fmt(r.p16)}<br>`
      + `<span class="sw" style="background:${VCOL.eps}"></span>EPS ${fmt(r.e)}<br><span class="sw" style="background:${VCOL.per}"></span>PER ${r.p.toFixed(2)}倍`;
    tip.style.display = 'block';
    const cr = card.getBoundingClientRect(), tw = tip.offsetWidth;
    let left = rect.left - cr.left + xi + 14; if (left + tw > cr.width - 8) left = rect.left - cr.left + xi - tw - 14;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = (rect.top - cr.top + 10) + 'px';
  };
  const leave = () => { vx.style.display = 'none'; tip.style.display = 'none'; };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('touchstart', move, { passive: true });
  hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', leave);
}
function setupValuation(d) {
  VROWS = d.nikkei_valuation || [];
  if (!VROWS.length) { $('#valuation').style.display = 'none'; return; }
  document.querySelectorAll('#vrng button').forEach(b => b.addEventListener('click', () => {
    VRANGE = b.dataset.r; document.querySelectorAll('#vrng button').forEach(x => x.classList.toggle('on', x === b)); drawValuation();
  }));
  drawValuation();
  const L = VROWS[VROWS.length - 1], tp = d.theory_per || 16, th = L[2] * tp;
  const md = L[0].slice(5).replace('-', '/').replace(/^0/, '');
  $('#vnow').innerHTML = `いま(${md})は EPS <b>${Math.round(L[2]).toLocaleString()}円</b>・PER <b>${L[3].toFixed(2)}倍</b>。理論値 EPS×${tp} = <b>${Math.round(th).toLocaleString()}円</b> に対して日経平均は ${L[1].toLocaleString()}円(${L[1] >= th ? '+' : ''}${((L[1] / th - 1) * 100).toFixed(1)}%)です。`;
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(drawValuation, 150); });
}


// ---- NS倍率と日経平均・S&P500 ---------------------------------------------
let NSROWS = [], NSRANGE = '1y';
function rangeSlice(rows, r) {
  if (!rows.length || r === 'all') return rows;
  const last = new Date(rows[rows.length - 1][0]);
  const from = new Date(last); from.setMonth(from.getMonth() - (r === '6m' ? 6 : 12));
  const f = from.toISOString().slice(0, 10);
  return rows.filter(x => x[0] >= f);
}
function drawNS() {
  const box = $('#nschart'); if (!box) return;
  const rows = rangeSlice(NSROWS, NSRANGE); if (rows.length < 2) { box.innerHTML = '<div class="nohist">データがありません</div>'; return; }
  const W = Math.max(320, box.clientWidth), narrow = W < 560;
  const L = narrow ? 44 : 58, R = narrow ? 8 : 14, GAP = 16, XB = 22;
  const panels = [{ key: 'ns', h: narrow ? 170 : 220 }, { key: 'idx', h: narrow ? 150 : 200 }];
  let top = 6; panels.forEach(p => { p.y0 = top; top += p.h + GAP; });
  const H = top - GAP + XB, n = rows.length, x = i => L + (W - L - R) * i / (n - 1);
  const nk0 = rows[0][1], sp0 = rows[0][2];
  const D = rows.map(r => ({ d: r[0], nk: r[1], sp: r[2], ns: r[3], nkr: r[1] / nk0 * 100, spr: r[2] / sp0 * 100 }));
  const series = { ns: [['ns', '#0F766E']], idx: [['spr', '#2563EB'], ['nkr', '#DC2626']] };
  const yOf = {}; let svg = '';
  panels.forEach(p => {
    const vals = D.flatMap(r => series[p.key].map(s => r[s[0]]));
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const y = v => p.y0 + p.h * (1 - (v - lo) / (hi - lo)); yOf[p.key] = y;
    niceTicks(lo, hi, narrow ? 3 : 5).forEach(t => {
      svg += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${p.key === 'ns' ? t.toFixed(1) : Math.round(t)}</text>`;
    });
    svg += `<rect class="fr" x="${L}" y="${p.y0}" width="${W - L - R}" height="${p.h}"/>`;
    if (p.key === 'idx') svg += `<line x1="${L}" x2="${W - R}" y1="${y(100)}" y2="${y(100)}" stroke="var(--muted-2)" stroke-dasharray="3 3"/>`;
    series[p.key].forEach(([k, col]) => {
      svg += `<path d="${path(D.map((_, i) => x(i)), D.map(r => y(r[k])))}" fill="none" stroke="${col}" stroke-width="1.9"/>`;
    });
  });
  const last = D[n - 1];
  svg += `<circle cx="${x(n - 1)}" cy="${yOf.ns(last.ns)}" r="3.5" fill="#0F766E"/>`;
  const nt = narrow ? 4 : 8;
  for (let k = 0; k <= nt; k++) {
    const i = Math.round((n - 1) * k / nt);
    svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === nt ? 'end' : 'middle'}">${md(D[i].d).slice(narrow ? 5 : 0)}</text>`;
  }
  svg += `<line id="nsx" x1="0" x2="0" y1="${panels[0].y0}" y2="${panels[1].y0 + panels[1].h}" stroke="var(--muted-2)" stroke-dasharray="3 3" style="display:none"/>`;
  svg += `<rect id="nshit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${svg}</svg>`;
  const pct = v => (v >= 100 ? '+' : '') + (v - 100).toFixed(1) + '%';
  $('#nsstats').innerHTML = `<span>${md(last.d)} NS倍率 <b style="color:#0F766E">${last.ns.toFixed(2)}</b>倍</span>`
    + `<span>期間の変化 日経 <b style="color:#DC2626">${pct(last.nkr)}</b></span><span>S&amp;P500 <b style="color:#2563EB">${pct(last.spr)}</b></span>`
    + `<span>NS倍率 <b>${pct(last.ns / D[0].ns * 100)}</b></span>`;
  const hit = $('#nshit'), vx = $('#nsx'), tip = $('#nstip'), card = $('#nsratio');
  const move = ev => {
    const pt = ev.touches ? ev.touches[0] : ev;
    const rect = box.querySelector('svg').getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((pt.clientX - rect.left - L) / (W - L - R) * (n - 1))));
    const r = D[i], xi = x(i);
    vx.setAttribute('x1', xi); vx.setAttribute('x2', xi); vx.style.display = '';
    tip.innerHTML = `<b>${md(r.d)}</b><br><span class="sw" style="background:#0F766E"></span>NS倍率 ${r.ns.toFixed(2)}倍<br>`
      + `<span class="sw" style="background:#DC2626"></span>日経平均 ${Math.round(r.nk).toLocaleString()}(${pct(r.nkr)})<br>`
      + `<span class="sw" style="background:#2563EB"></span>S&amp;P500 ${r.sp.toLocaleString()}(${pct(r.spr)})`;
    tip.style.display = 'block';
    const cr = card.getBoundingClientRect(), tw = tip.offsetWidth;
    let left = rect.left - cr.left + xi + 14; if (left + tw > cr.width - 8) left = rect.left - cr.left + xi - tw - 14;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = (rect.top - cr.top + 10) + 'px';
  };
  const leave = () => { vx.style.display = 'none'; tip.style.display = 'none'; };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('touchstart', move, { passive: true });
  hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', leave);
}
function setupNS(d) {
  NSROWS = d.ns_ratio || [];
  if (!NSROWS.length) { $('#nsratio').style.display = 'none'; return; }
  document.querySelectorAll('#nsrng button').forEach(b => b.addEventListener('click', () => {
